<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d11" />
  <title>UAT Görsel İşaretleyici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #0b0d11;
  --bg-2: #12151c;
  --bg-3: #171b24;
  --panel: #141821;
  --line: #262c38;
  --line-soft: #1e232e;
  --text: #e8ecf4;
  --muted: #8b93a7;
  --muted-2: #626a7d;
  --accent: #4f8cff;
  --accent-2: #7c5cff;
  --danger: #ff4d5e;
  --ok: #35d07f;
  --warn: #ffb020;
  --radius: 12px;
  --radius-sm: 9px;
  --shadow: 0 10px 34px rgba(0, 0, 0, .45);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ---------- Topbar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 14px;
  background: linear-gradient(180deg, #12151d, #0e1117);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 240px; }

.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  flex: none;
  box-shadow: 0 6px 18px rgba(79, 140, 255, .35);
}
.brand-mark svg { width: 21px; height: 21px; }

.brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.project-name {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  font-weight: 600;
  font-size: 15px;
  padding: 3px 7px;
  margin-left: -7px;
  width: 220px;
  outline: none;
}
.project-name:hover { border-color: var(--line); }
.project-name:focus { border-color: var(--accent); background: var(--bg-2); }
.brand-sub { font-size: 11.5px; color: var(--muted); padding-left: 1px; }

.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-3);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
  user-select: none;
}
.btn svg { width: 17px; height: 17px; }
.btn:hover { background: #1d2230; border-color: #333c4d; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.icon { padding: 8px; }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #3f7bf0);
  border-color: transparent;
  color: #fff;
  font-weight: 500;
  box-shadow: 0 4px 14px rgba(79, 140, 255, .3);
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.tiny { padding: 4px 9px; font-size: 12px; }
.btn.danger { color: #ffd9dd; border-color: #4a2430; background: #2a1720; }
.btn.danger:hover { background: #3a1d28; }

.divider { width: 1px; height: 24px; background: var(--line); }

.menu-wrap { position: relative; }
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  min-width: 210px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 6px;
  z-index: 40;
  display: flex;
  flex-direction: column;
}
.menu button {
  text-align: left;
  padding: 9px 11px;
  border: none;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
}
.menu button:hover { background: #222838; }
.menu[hidden] { display: none; }

/* ---------- Body layout ---------- */
.body {
  flex: 1;
  display: grid;
  grid-template-columns: 58px 1fr 292px;
  min-height: 0;
}

/* ---------- Toolbar ---------- */
.toolbar {
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  padding: 10px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  overflow-y: auto;
}
.tool {
  position: relative;
  width: 42px;
  height: 42px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.tool svg { width: 20px; height: 20px; }
.tool:hover { background: var(--bg-3); color: var(--text); }
.tool.is-active {
  background: linear-gradient(135deg, rgba(79,140,255,.22), rgba(124,92,255,.22));
  color: #bcd0ff;
  border-color: rgba(79, 140, 255, .45);
}
.tool-sep { width: 26px; height: 1px; background: var(--line); margin: 4px 0; }

/* ---------- Stage ---------- */
.stage {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, #1b2029 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
  min-width: 0;
}
#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
#canvas.cursor-move { cursor: move; }
#canvas.cursor-pan { cursor: grab; }
#canvas.cursor-pan:active { cursor: grabbing; }
#canvas.cursor-default { cursor: default; }

.zoom-bar {
  position: absolute;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(20, 24, 33, .92);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
  backdrop-filter: blur(8px);
  z-index: 6;
}
.zoom-btn {
  min-width: 34px;
  height: 30px;
  padding: 0 10px;
  border: none;
  background: transparent;
  color: var(--text);
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
}
.zoom-btn:hover { background: var(--bg-3); }

.stage-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 5;
  pointer-events: none;
}
.stage-empty[hidden] { display: none; }
.empty-card {
  pointer-events: auto;
  width: min(440px, 90%);
  text-align: center;
  padding: 34px 28px;
  border-radius: 18px;
  background: rgba(20, 24, 33, .82);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(6px);
}
.empty-icon {
  width: 60px; height: 60px; margin: 0 auto 14px;
  display: grid; place-items: center;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(79,140,255,.18), rgba(124,92,255,.18));
  color: #9db9ff;
}
.empty-icon svg { width: 30px; height: 30px; }
.empty-card h2 { margin: 0 0 8px; font-size: 18px; }
.empty-card p { margin: 0 0 20px; color: var(--muted); line-height: 1.55; font-size: 13.5px; }
.empty-card b { color: #c8d4ee; font-weight: 600; }
.empty-actions { display: flex; gap: 10px; justify-content: center; }

.drop-hint {
  position: absolute;
  inset: 12px;
  border: 2px dashed var(--accent);
  border-radius: 16px;
  display: none;
  place-items: center;
  font-size: 16px;
  font-weight: 600;
  color: #bcd0ff;
  background: rgba(79, 140, 255, .08);
  z-index: 8;
  pointer-events: none;
}
.drop-hint.is-active { display: grid; }

/* ---------- Panel ---------- */
.panel {
  background: var(--bg-2);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.panel-block { padding: 14px; border-bottom: 1px solid var(--line-soft); }
.panel-title {
  margin: 0 0 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted-2);
  font-weight: 600;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.panel-head .panel-title { margin: 0; }

.pane-switch {
  display: flex; gap: 2px; padding: 2px; margin-left: auto;
  background: var(--bg-3); border: 1px solid var(--line); border-radius: 8px;
}
.pane-switch[hidden] { display: none; }
.pane-switch button {
  width: 26px; height: 22px; border: none; background: transparent;
  color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
}
.pane-switch button:hover { color: var(--text); }
.pane-switch button.is-active { background: var(--accent); color: #fff; }

.prop-row { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.prop-row[hidden] { display: none; }
.prop-row > label { font-size: 12.5px; color: var(--muted); }

.color-wrap { display: flex; align-items: center; gap: 10px; }
input[type="color"] {
  width: 40px; height: 32px; padding: 0;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg-3); cursor: pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }

.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch {
  width: 20px; height: 20px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.14);
  cursor: pointer; padding: 0;
}
.swatch:hover { transform: scale(1.12); }

.range-wrap { display: flex; align-items: center; gap: 10px; }
input[type="range"] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 999px; background: #2a3140; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid #0b0d11;
  box-shadow: 0 0 0 1px var(--accent);
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%; background: var(--accent);
  cursor: pointer; border: 2px solid #0b0d11;
}
.val { width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }

.seg { display: flex; background: var(--bg-3); border-radius: 9px; padding: 3px; border: 1px solid var(--line); }
.seg button {
  flex: 1; border: none; background: transparent; color: var(--muted);
  padding: 7px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
}
.seg button.is-active { background: var(--accent); color: #fff; }

.number-wrap { display: flex; align-items: center; gap: 8px; }.number-wrap input[type="number"] {
  width: 74px; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg-3); outline: none;
}
.number-wrap input[type="number"]:focus { border-color: var(--accent); }

.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; color: var(--muted); user-select: none; }
.check input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
.check:hover { color: var(--text); }

.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-row .btn.is-active { background: var(--accent); border-color: transparent; color: #fff; }

/* Layers */
.layers { flex: 1; }
.layer-list { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
.layer-empty { color: var(--muted-2); font-size: 12.5px; padding: 10px 4px; }
.layer {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 9px;
  border: 1px solid transparent; cursor: pointer;
}
.layer:hover { background: var(--bg-3); }
.layer.is-sel { background: rgba(79,140,255,.14); border-color: rgba(79,140,255,.4); }
.layer-ic { width: 16px; height: 16px; flex: none; color: var(--muted); }
.layer-ic svg { width: 16px; height: 16px; }
.layer-name {
  flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; color: #cdd5e6;
}
.layer-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.layer:hover .layer-actions, .layer.is-sel .layer-actions { opacity: 1; }
.layer-actions button {
  width: 22px; height: 22px; border: none; background: transparent;
  color: var(--muted); border-radius: 6px; cursor: pointer; display: grid; place-items: center;
}
.layer-actions button:hover { background: #2a3140; color: var(--text); }
.layer-actions svg { width: 14px; height: 14px; }
.layer.is-hidden .layer-name { opacity: .45; text-decoration: line-through; }

/* Shortcut tips */
.tip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.tip { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.tip kbd {
  font-family: var(--font); font-size: 11px; font-weight: 600;
  background: var(--bg-3); border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; color: #c3cbdd;
  min-width: 20px; text-align: center;
}

/* ---------- Statusbar ---------- */
.statusbar {
  display: flex; align-items: center; gap: 16px;
  padding: 7px 14px;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.statusbar .spacer { flex: 1; }

/* ---------- Popover ---------- */
.popover {
  position: fixed;
  top: 66px; right: 14px;
  width: 340px; max-height: 70vh;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 60;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.popover[hidden] { display: none; }
.popover-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.popover-body { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.popover-foot { padding: 10px 12px; border-top: 1px solid var(--line); }

.project-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent;
}
.project-item:hover { background: #202634; }
.project-item.is-active { border-color: rgba(79,140,255,.5); background: rgba(79,140,255,.12); }
.project-thumb {
  width: 54px; height: 38px; flex: none; border-radius: 7px;
  object-fit: cover; background: var(--bg-2); border: 1px solid var(--line);
}
.project-thumb.blank { display: grid; place-items: center; color: var(--muted-2); }
.project-meta { flex: 1; min-width: 0; }
.project-meta strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-meta span { font-size: 11.5px; color: var(--muted-2); }
.project-del {
  width: 28px; height: 28px; border: none; background: transparent; color: var(--muted-2);
  border-radius: 7px; cursor: pointer; display: grid; place-items: center; flex: none;
}
.project-del:hover { background: #3a1d28; color: #ffb6bd; }
.project-del svg { width: 15px; height: 15px; }
.popover-empty { color: var(--muted-2); font-size: 13px; padding: 18px; text-align: center; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(5, 7, 10, .6);
  backdrop-filter: blur(3px);
  display: grid; place-items: center; z-index: 80;
}
.modal-overlay[hidden] { display: none; }
.modal {
  width: min(440px, 92vw);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal textarea {
  width: 100%; resize: vertical; padding: 11px 12px;
  border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg-2); outline: none; line-height: 1.5;
}
.modal textarea:focus { border-color: var(--accent); }
.modal-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.modal-row > label { font-size: 12.5px; color: var(--muted); width: 92px; flex: none; }
.modal-row .range-wrap { flex: 1; }
.modal-row .seg { flex: 1; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; margin-top: 14px; }

.icon-btn {
  width: 30px; height: 30px; border: none; background: transparent;
  color: var(--muted); border-radius: 8px; cursor: pointer; display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: #1c2230; border: 1px solid var(--line);
  color: var(--text); padding: 11px 16px; border-radius: 10px;
  box-shadow: var(--shadow); font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 100; max-width: 80vw;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }
.toast.is-error { border-color: #5a2630; background: #2a1720; }
.toast.is-ok { border-color: #1f4a36; background: #14261d; }

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 999px; border: 2px solid var(--bg-2); }
::-webkit-scrollbar-thumb:hover { background: #39425a; }

@media (max-width: 1080px) {
  .body { grid-template-columns: 54px 1fr 260px; }
  .brand { min-width: 0; }
  .project-name { width: 150px; }
}

@media (max-width: 860px) {
  .topbar-actions .btn span { display: none; }
  .topbar-actions .btn { padding: 8px; }
  .body { grid-template-columns: 52px 1fr; }
  .panel { display: none; }
}

</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M7 16.5 10.5 12l2.5 3 2-2.4 2 3.9" />
            <circle cx="9" cy="8" r="1.4" />
          </svg>
        </span>
        <div class="brand-text">
          <input id="projectName" class="project-name" value="Yeni Proje" spellcheck="false" aria-label="Proje adı" />
          <span class="brand-sub" id="saveStatus">Hazır</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="projectsBtn" class="btn" type="button" title="Kayıtlı projeler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Projeler</span>
        </button>
        <button id="openBtn" class="btn" type="button" title="Görsel Aç (O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
          <span>Görsel Aç</span>
        </button>
        <button id="pasteBtn" class="btn" type="button" title="Panodan Yapıştır (Ctrl+V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
          <span>Yapıştır</span>
        </button>
        <button id="captureBtn" class="btn" type="button" title="Ekran görüntüsü al">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6"/><path d="M12 17v4"/><circle cx="12" cy="10.5" r="2.6"/></svg>
          <span>Ekran Görüntüsü</span>
        </button>
        <button id="compareBtn" class="btn" type="button" title="İkinci görsel ekle / değiştir (yan yana karşılaştırma)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg>
          <span>2. Görsel</span>

  <script>

/* ===== js/state.js ===== */
(function () {
  "use strict";

  const SSA = (window.SSA = window.SSA || {});

  /* World-space gap (px) between the two comparison panes. */
  SSA.PANE_GAP = 24;

  /* ---------------- Utilities ---------------- */
  SSA.util = {
    uid() {
      return "a" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    },
    clone(o) {
      try {
        return structuredClone(o);
      } catch (e) {
        return JSON.parse(JSON.stringify(o));
      }
    },
    clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    },
    debounce(fn, ms) {
      let t = null;
      let lastArgs = null;
      let self = null;
      return function () {
        lastArgs = arguments;
        self = this;
        clearTimeout(t);
        t = setTimeout(function () {
          t = null;
          fn.apply(self, lastArgs);
        }, ms);
      };
    },
    fmtDate(ts) {
      if (!ts) return "";
      try {
        return new Date(ts).toLocaleString("tr-TR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch (e) {
        return new Date(ts).toLocaleString();
      }
    },
    bytes(n) {
      if (!n) return "0 B";
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(2) + " MB";
    },
    isEditable(el) {
      if (!el) return false;
      const tag = (el.tagName || "").toLowerCase();
      return tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable;
    }
  };

  /* ---------------- Store: IndexedDB (localStorage fallback) ---------------- */
  const P_ACTIVE = "ssa.active.v1";
  const P_PREFS = "ssa.prefs.v1";
  const P_LIST = "ssa.projects.v1";
  const DB_NAME = "ssa.db";
  const DB_VER = 1;
  const ST_PROJ = "projects";
  const ST_META = "meta";

  SSA.Store = (function () {
    let db = null;
    let mode = "ls";
    let metas = [];
    let initPromise = null;

    function reqP(request) {
      return new Promise(function (resolve, reject) {
        request.onsuccess = function () {
          resolve(request.result);
        };
        request.onerror = function () {
          reject(request.error);
        };
      });
    }
    function store(name, txnMode) {
      return db.transaction(name, txnMode).objectStore(name);
    }
    function idbPut(name, val) {
      return reqP(store(name, "readwrite").put(val));
    }
    function idbDel(name, key) {
      return reqP(store(name, "readwrite").delete(key));
    }

    function openDB() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) {
          reject(new Error("no-idb"));
          return;
        }
        let req;
        try {
          req = window.indexedDB.open(DB_NAME, DB_VER);
        } catch (e) {
          reject(e);
          return;
        }
        req.onupgradeneeded = function () {
          const d = req.result;
          if (!d.objectStoreNames.contains(ST_PROJ)) d.createObjectStore(ST_PROJ, { keyPath: "id" });
          if (!d.objectStoreNames.contains(ST_META)) d.createObjectStore(ST_META, { keyPath: "id" });
        };
        req.onsuccess = function () {
          resolve(req.result);
        };
        req.onerror = function () {
          reject(req.error || new Error("idb-open"));
        };
        req.onblocked = function () {
          reject(new Error("idb-blocked"));
        };
      });
    }

    function lsList() {
      try {
        return JSON.parse(localStorage.getItem(P_LIST) || "[]") || [];
      } catch (e) {
        return [];
      }
    }
    function lsSetList(l) {
      try {
        localStorage.setItem(P_LIST, JSON.stringify(l));
      } catch (e) {
        /* ignore */
      }
    }
    function lsGet(id) {
      try {
        const r = localStorage.getItem("ssa.project." + id);
        return r ? JSON.parse(r) : null;
      } catch (e) {
        return null;
      }
    }
    function lsSet(id, payload) {
      localStorage.setItem("ssa.project." + id, JSON.stringify(payload));
    }
    function lsRemove(id) {
      try {
        localStorage.removeItem("ssa.project." + id);
      } catch (e) {
        /* ignore */
      }
    }

    async function migrateLegacy() {
      const legacy = lsList();
      if (!legacy.length) return;
      for (let i = 0; i < legacy.length; i++) {
        const m = legacy[i];
        const p = lsGet(m.id);
        if (p) {
          await idbPut(ST_PROJ, p);
          await idbPut(ST_META, m);
        }
      }
      metas = legacy.slice();
      for (let i = 0; i < legacy.length; i++) lsRemove(legacy[i].id);
      try {
        localStorage.removeItem(P_LIST);
      } catch (e) {
        /* ignore */
      }
    }

    function init() {
      if (initPromise) return initPromise;
      initPromise = (async function () {
        try {
          db = await openDB();
          mode = "idb";
          const all = await reqP(store(ST_META, "readonly").getAll());
          metas = all || [];
          await migrateLegacy();
        } catch (e) {
          mode = "ls";
          db = null;
          metas = lsList();
        }
        return mode;
      })();
      return initPromise;
    }

    function payloadOf(p) {
      const payload = {
        id: p.id,
        name: p.name,
        updatedAt: p.updatedAt,
        image: { src: p.image.src, w: p.image.w, h: p.image.h },
        annotations: p.annotations,
        view: { scale: 1, ox: 0, oy: 0 },
        numberSeed: p.numberSeed
      };
      if (p.image2) {
        payload.image2 = { src: p.image2.src, w: p.image2.w, h: p.image2.h };
        payload.annotations2 = p.annotations2 || [];
        payload.image2Pos = p.image2Pos || { x: p.image.w + SSA.PANE_GAP, y: 0 };
        payload.image2Opacity = typeof p.image2Opacity === "number" ? p.image2Opacity : 1;
      }
      return payload;
    }

    return {
      init: init,
      mode: function () {
        return mode;
      },
      list: function () {
        return metas.slice();
      },
      upsertMeta: function (meta) {
        const i = metas.findIndex(function (m) {
          return m.id === meta.id;
        });
        if (i >= 0) metas[i] = meta;
        else metas.unshift(meta);
        if (mode === "idb") {
          idbPut(ST_META, meta).catch(function () {});
        } else {
          const l = lsList();
          const j = l.findIndex(function (m) {
            return m.id === meta.id;
          });
          if (j >= 0) l[j] = meta;
          else l.unshift(meta);
          lsSetList(l);
        }
      },
      getProject: async function (id) {
        if (mode === "idb") {
          try {
            const p = await reqP(store(ST_PROJ, "readonly").get(id));
            return p || null;
          } catch (e) {
            return null;
          }
        }
        return lsGet(id);
      },
      saveProject: async function (p) {
        const payload = payloadOf(p);
        if (mode === "idb") {
          try {
            await idbPut(ST_PROJ, payload);
            return true;
          } catch (e) {
            return false;
          }
        }
        try {
          lsSet(p.id, payload);
          return true;
        } catch (e) {
          return false;
        }
      },
      remove: function (id) {
        metas = metas.filter(function (m) {
          return m.id !== id;
        });
        if (mode === "idb") {
          idbDel(ST_PROJ, id).catch(function () {});
          idbDel(ST_META, id).catch(function () {});
        } else {
          lsRemove(id);
          lsSetList(
            lsList().filter(function (m) {
              return m.id !== id;
            })
          );
        }
        try {
          if (localStorage.getItem(P_ACTIVE) === id) localStorage.removeItem(P_ACTIVE);
        } catch (e) {
          /* ignore */
        }
      },
      setActive: function (id) {
        try {
          if (id) localStorage.setItem(P_ACTIVE, id);
          else localStorage.removeItem(P_ACTIVE);
        } catch (e) {
          /* ignore */
        }
      },
      getActive: function () {
        try {
          return localStorage.getItem(P_ACTIVE);
        } catch (e) {
          return null;
        }
      },
      prefs: function () {
        try {
          const raw = localStorage.getItem(P_PREFS);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      },
      setPrefs: function (o) {
        try {
          localStorage.setItem(P_PREFS, JSON.stringify(o));
        } catch (e) {
          /* ignore */
        }
      }
    };
  })();

  /* ---------------- Annotation factory ---------------- */
  SSA.makeAnn = function (type, pt, st) {
    const base = {
      id: SSA.util.uid(),
      type: type,
      color: st.color,
      width: st.width,
      opacity: st.opacity
    };

    switch (type) {
      case "arrow":
      case "line":
        base.x1 = pt.x;
        base.y1 = pt.y;
        base.x2 = pt.x;
        base.y2 = pt.y;
        break;
      case "freehand":
      case "strike":
        base.points = [[pt.x, pt.y]];
        break;
      case "rect":
      case "ellipse":
      case "highlight":
        base.x = pt.x;
        base.y = pt.y;
        base.w = 0;
        base.h = 0;
        break;
      case "blur":
        base.x = pt.x;
        base.y = pt.y;
        base.w = 0;
        base.h = 0;
        base.mode = st.blurMode;
        base.strength = st.blurStrength;
        break;
      case "text":
      case "label":
        base.x = pt.x;
        base.y = pt.y;
        base.text = "";
        base.fontSize = st.fontSize;
        base.bg = type === "label" ? "color" : "none";
        break;
      case "cross":
      case "tick":
        base.x = pt.x;
        base.y = pt.y;
        base.size = st.badgeSize || 30;
        base.width = Math.max(5, (st.width || 4) + 2);
        break;
      case "pin":
        base.x = pt.x;
        base.y = pt.y;
        base.size = 32;
        break;
      case "number":
        base.x = pt.x;
        base.y = pt.y;
        base.n =
          SSA.App && SSA.App.state.project ? SSA.App.state.project.numberSeed : 1;
        base.r = 13;
        break;
      default:
        base.x = pt.x;
        base.y = pt.y;
    }
    return base;
  };

  /* ---------------- Image helpers ---------------- */
  SSA.imageToDataURL = function (img, maxDim, usePng) {
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const scale = maxDim && Math.max(w, h) > maxDim ? maxDim / Math.max(w, h) : 1;
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const cx = c.getContext("2d");
    cx.drawImage(img, 0, 0, w, h);
    if (usePng) return c.toDataURL("image/png");
    return c.toDataURL("image/jpeg", 0.92);
  };

  /* Shrink/compress one image (+ its annotations) for storage.
     Mutates the project so in-memory coordinates stay consistent. */
  function shrinkOne(p, imgProp, elProp, annProp) {
    const im = p[imgProp];
    const el = p[elProp];
    if (!im || !el) return;
    const w0 = im.w;
    const h0 = im.h;
    const maxDim = 2600;
    const big = Math.max(w0, h0) > maxDim;
    const isPng = /^data:image\/png/i.test(im.src);
    const pngHeavy = isPng && im.src.length > 400000;
    if (!big && !pngHeavy) return;

    const s = big ? maxDim / Math.max(w0, h0) : 1;
    const w = Math.max(1, Math.round(w0 * s));
    const h = Math.max(1, Math.round(h0 * s));
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const cx = c.getContext("2d");
    cx.imageSmoothingQuality = "high";

    ctx.moveTo(x2, y1);
    ctx.lineTo(x1, y2);
    ctx.stroke();
    ctx.strokeStyle = a.color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.moveTo(x2, y1);
    ctx.lineTo(x1, y2);
    ctx.stroke();
  }

  function drawTick(ctx, a) {
    const s = a.size || 30;
    const lw = a.width || 6;
    const p1 = { x: a.x - s * 0.34, y: a.y + s * 0.02 };
    const p2 = { x: a.x - s * 0.08, y: a.y + s * 0.28 };
    const p3 = { x: a.x + s * 0.38, y: a.y - s * 0.28 };
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = lw + 4;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.stroke();
    ctx.strokeStyle = a.color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.stroke();
  }

  function drawPin(ctx, a) {
    const size = a.size || 32;
    const r = size * 0.28;
    const cy = a.y - size * 0.75;
    ctx.beginPath();
    ctx.moveTo(a.x - r * 0.72, cy + r * 0.62);
    ctx.lineTo(a.x, a.y);
    ctx.lineTo(a.x + r * 0.72, cy + r * 0.62);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(a.x, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(a.x, cy, r * 0.38, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawNumber(ctx, a) {
    const r = a.r || 13;
    ctx.beginPath();
    ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = fontStr(Math.round(r * 1.12), 700);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(a.n), a.x, a.y + 0.5);
  }

  function drawAnn(ctx, a, env) {
    if (a.hidden) return;
    ctx.save();
    ctx.globalAlpha = a.opacity == null ? 1 : a.opacity;
    ctx.strokeStyle = a.color;
    ctx.fillStyle = a.color;
    ctx.lineWidth = a.width || 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    switch (a.type) {
      case "line":
        ctx.beginPath();
        ctx.moveTo(a.x1, a.y1);
        ctx.lineTo(a.x2, a.y2);
        ctx.stroke();
        break;
      case "arrow":
        drawArrow(ctx, a);
        break;
      case "freehand":
      case "strike":
        drawPath(ctx, a);
        break;
      case "rect":
        ctx.strokeRect(a.x, a.y, a.w, a.h);
        break;
      case "ellipse":
        ctx.beginPath();
        ctx.ellipse(a.x + a.w / 2, a.y + a.h / 2, Math.abs(a.w / 2), Math.abs(a.h / 2), 0, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case "highlight":
        ctx.globalCompositeOperation = "multiply";
        ctx.globalAlpha = a.opacity == null ? 0.5 : a.opacity;
        ctx.fillRect(a.x, a.y, a.w, a.h);
        break;
      case "text":
      case "label":
        drawTextLike(ctx, a);
        break;
      case "cross":
        drawCross(ctx, a);
        break;
      case "tick":
        drawTick(ctx, a);
        break;
      case "pin":
        drawPin(ctx, a);
        break;
      case "number":
        drawNumber(ctx, a);
        break;
      case "blur":
        applyRegion(ctx, env.canvas, { x: a.x, y: a.y, w: a.w, h: a.h }, a.mode, a.strength || 12, env.view, env.dpr);
        break;
    }
    ctx.restore();
  }

  function drawOverlay(ctx, annotations, view, selectedIds, dpr) {
    if (!selectedIds || !selectedIds.length || !annotations) return;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = 0; i < annotations.length; i++) {
      const a = annotations[i];
      if (selectedIds.indexOf(a.id) < 0 || a.hidden) continue;
      const b = SSA.geom.bbox(a);
      const p1 = imageToScreen(b.x, b.y, view);
      const p2 = imageToScreen(b.x + b.w, b.y + b.h, view);
      const x = Math.min(p1.x, p2.x) - 2;
      const y = Math.min(p1.y, p2.y) - 2;
      const w = Math.abs(p2.x - p1.x) + 4;
      const h = Math.abs(p2.y - p1.y) + 4;

      ctx.strokeStyle = "#4f8cff";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);

      const hs = SSA.geom.handlesScreen(a, view);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#4f8cff";
      ctx.lineWidth = 1.5;
      for (const k in hs) {
        const pt = hs[k];
        ctx.beginPath();
        ctx.rect(pt.x - 4, pt.y - 4, 8, 8);
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function renderScene(ctx, canvas, project, view, dpr, opts) {
    const options = opts || {};
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    if (options.background !== false) {
      ctx.fillStyle = "#0b0d11";
      ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    }

    if (!project || !project.image || !project.imageEl) return;

    const o2 = project.image2
      ? project.image2Pos || { x: project.image.w + SSA.PANE_GAP, y: 0 }
      : { x: 0, y: 0 };
    const a2 = project.image2Opacity == null ? 1 : project.image2Opacity;
    ctx.save();
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);
    ctx.imageSmoothingQuality = "high";
    try {
      ctx.drawImage(project.imageEl, 0, 0, project.image.w, project.image.h);
    } catch (e) {
      /* image not ready */
    }
    if (project.image2 && project.imageEl2) {
      ctx.save();
      ctx.globalAlpha = a2;
      try {
        ctx.drawImage(project.imageEl2, o2.x, o2.y, project.image2.w, project.image2.h);
      } catch (e) {
        /* image not ready */
      }
      ctx.restore();
    }
    const env = { canvas: canvas, view: view, dpr: dpr };
    const env2 = {
      canvas: canvas,
      view: { scale: view.scale, ox: view.ox + o2.x * view.scale, oy: view.oy + o2.y * view.scale },
      dpr: dpr
    };
    for (let i = 0; i < project.annotations.length; i++) {
      drawAnn(ctx, project.annotations[i], env);
    }
    if (project.image2 && project.annotations2) {
      ctx.save();
      ctx.translate(o2.x, o2.y);
      for (let i = 0; i < project.annotations2.length; i++) {
        drawAnn(ctx, project.annotations2[i], env2);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPaneLabels(ctx, project, view, dpr) {
    if (!project || !project.image2 || !project.image) return;
    const o2 = project.image2Pos || { x: project.image.w + SSA.PANE_GAP, y: 0 };
    const chips = [
      { n: "1", wx: 0, wy: 0 },
      { n: "2", wx: o2.x, wy: o2.y }
    ];
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = 0; i < chips.length; i++) {
      const p = imageToScreen(chips[i].wx, chips[i].wy, view);
      const x = p.x + 10;
      const y = p.y + 10;
      roundRect(ctx, x, y, 26, 22, 7);
      ctx.fillStyle = "rgba(12,14,19,0.78)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#e8ecf4";
      ctx.font = fontStr(12, 600);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(chips[i].n, x + 13, y + 12);
    }
    ctx.restore();
  }

  SSA.Render = {
    measureText: measureText,
    textMetrics: textMetrics,
    drawAnn: drawAnn,
    drawOverlay: drawOverlay,
    renderScene: renderScene,
    drawPaneLabels: drawPaneLabels,
    roundRect: roundRect,
    imageToScreen: imageToScreen,
    applyRegion: applyRegion
  };
})();

/* ===== js/export.js ===== */
(function () {
  "use strict";

  const SSA = (window.SSA = window.SSA || {});

  function renderFull(project, cb) {
    if (!project || !project.image || !project.imageEl) {
      cb(null);
      return;
    }
    const gap = SSA.PANE_GAP || 24;
    const has2 = !!(project.image2 && project.imageEl2);
    const o2 = has2
      ? project.image2Pos || { x: project.image.w + gap, y: 0 }
      : { x: 0, y: 0 };
    const minX = has2 ? Math.min(0, o2.x) : 0;
    const minY = has2 ? Math.min(0, o2.y) : 0;
    const maxX = has2 ? Math.max(project.image.w, o2.x + project.image2.w) : project.image.w;
    const maxY = has2 ? Math.max(project.image.h, o2.y + project.image2.h) : project.image.h;
    const pad = has2 ? 0 : 0;
    const W = Math.max(1, Math.round(maxX - minX + pad * 2));
    const H = Math.max(1, Math.round(maxY - minY + pad * 2));
    const c = document.createElement("canvas");
    c.width = W;
    c.height = H;
    const cx = c.getContext("2d");
    cx.clearRect(0, 0, c.width, c.height);

    const dx1 = -minX + pad;
    const dy1 = -minY + pad;
    try {
      cx.drawImage(project.imageEl, dx1, dy1, project.image.w, project.image.h);
    } catch (e) {
      /* ignore */
    }
    const env = { canvas: c, view: { scale: 1, ox: dx1, oy: dy1 }, dpr: 1 };
    for (let i = 0; i < project.annotations.length; i++) {
      if (!project.annotations[i].hidden) SSA.Render.drawAnn(cx, project.annotations[i], env);
    }
    if (has2) {
      const dx2 = dx1 + o2.x;
      const dy2 = dy1 + o2.y;
      const a2 = project.image2Opacity == null ? 1 : project.image2Opacity;
      cx.save();
      cx.globalAlpha = a2;
      try {
        cx.drawImage(project.imageEl2, dx2, dy2, project.image2.w, project.image2.h);
      } catch (e) {
        /* ignore */
      }
      cx.restore();
      const env2 = { canvas: c, view: { scale: 1, ox: dx2, oy: dy2 }, dpr: 1 };
      cx.save();
      cx.translate(dx2, dy2);
      const anns2 = project.annotations2 || [];
      for (let i = 0; i < anns2.length; i++) {
        if (!anns2[i].hidden) SSA.Render.drawAnn(cx, anns2[i], env2);
      }
      cx.restore();
    }
    cb(c);
  }

  function safeName(name) {
    return (name || "uat-gorsel").replace(/[\\/:*?"<>|]+/g, "-").trim() || "uat-gorsel";
  }

  SSA.Export = {
    renderFull: renderFull,

    downloadPNG(project, name) {
      renderFull(project, function (c) {
        if (!c) return;
        c.toBlob(function (blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = safeName(name) + ".png";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 3000);
        }, "image/png");
      });
    },

    copyPNG(project) {
      return new Promise(function (resolve, reject) {
        if (!navigator.clipboard || !window.ClipboardItem) {
          reject(new Error("Pano API desteklenmiyor"));
          return;
        }
        renderFull(project, function (c) {
          if (!c) {
            reject(new Error("Görsel yok"));
            return;
          }
          c.toBlob(function (blob) {
            navigator.clipboard
              .write([new ClipboardItem({ "image/png": blob })])
              .then(resolve)
              .catch(reject);
          }, "image/png");
        });
      });
    },

    downloadJSON(project) {
      const data = {
        app: "uat-screenshot-annotator",
        version: 1,
        name: project.name,
        image: project.image,
        annotations: project.annotations,
        numberSeed: project.numberSeed
      };
      if (project.image2) {
        data.image2 = project.image2;
        data.annotations2 = project.annotations2 || [];
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = safeName(project.name) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 3000);
    },

    readJSON(file) {
      return new Promise(function (resolve, reject) {
        const fr = new FileReader();
        fr.onload = function () {
          try {
            const data = JSON.parse(fr.result);
            if (!data || !data.image || !data.image.src) throw new Error("Geçersiz dosya");
            resolve(data);
          } catch (e) {
            reject(e);
          }
        };
        fr.onerror = reject;
        fr.readAsText(file);
      });
    }
  };
})();

/* ===== js/tools.js ===== */
﻿(function () {
  "use strict";

  const SSA = (window.SSA = window.SSA || {});

  const DRAG_TOOLS = {
    arrow: 1,
    line: 1,
    freehand: 1,
    strike: 1,
    rect: 1,
    ellipse: 1,
    highlight: 1,
    blur: 1
  };
  const BBOX_TOOLS = { rect: 1, ellipse: 1, highlight: 1, blur: 1 };
  const CLICK_TOOLS = { pin: 1, number: 1, text: 1, label: 1, cross: 1, tick: 1 };

  let canvas = null;

  const session = {
    mode: "idle",
    startImg: null,
    startScreen: null,
    startView: null,
    current: null,
    snapshots: null,
    handle: null,
    ann: null,
    cropRect: null,
    changed: false,
    pane: 1
  };

  function relPt(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function reset() {
    session.mode = "idle";
    session.startImg = null;
    session.startScreen = null;
    session.startView = null;
    session.current = null;
    session.snapshots = null;
    session.handle = null;
    session.ann = null;
    session.cropRect = null;
    session.changed = false;
    SSA.App.state.preview = null;
    SSA.App.state.previewPane = SSA.App.state.activePane;
  }

  function normalizeRect(x1, y1, x2, y2) {
    return {
      x: Math.min(x1, x2),
      y: Math.min(y1, y2),
      w: Math.abs(x2 - x1),
      h: Math.abs(y2 - y1)
    };
  }

  function startPan(sp) {
    const App = SSA.App;
    session.mode = "pan";
    session.startScreen = sp;
    session.startView = {
      scale: App.state.project.view.scale,
      ox: App.state.project.view.ox,
      oy: App.state.project.view.oy
    };
    session.changed = false;
    canvas.classList.add("cursor-pan");
  }

  function paneAt(world) {
    return SSA.App.paneAt(world);
  }

  function toLocal(worldPt, pane) {
    return SSA.App.toLocal(worldPt, pane);
  }

  function viewForPane(pane) {
    return SSA.App.viewForPane(pane);
  }

  function onDown(ev) {
    if (ev.button !== 0 && ev.button !== 1) return;
    if (ev.detail && ev.detail > 1) return;
    const App = SSA.App;
    if (!App || !App.state.project || !App.state.project.image) return;

    const sp = relPt(ev);
    const world = App.screenToImage(sp.x, sp.y);
    const pane = paneAt(world);
    if (App.state.activePane !== pane) App.setActivePane(pane);
    session.pane = pane;
    const ip = toLocal(world, pane);
    const tool = App.state.tool;

    if (ev.button === 1 || App.state.spaceDown || tool === "pan") {
      startPan(sp);
      ev.preventDefault();
      return;
    }

    if (App.state.moveImage2 && App.state.project.image2) {
      const o = App.paneOrigin(2);
      const im2 = App.state.project.image2;
      if (world.x >= o.x && world.x <= o.x + im2.w && world.y >= o.y && world.y <= o.y + im2.h) {
        session.mode = "moveImage";
        session.startWorld = world;
        session.startPos = { x: o.x, y: o.y };
        session.changed = false;
        canvas.classList.add("cursor-pan");
        ev.preventDefault();
        return;
      }
    }

    if (tool === "select") {
      const sel = App.selectedAnns();
      if (sel.length === 1) {
        const h = SSA.geom.handleAt(sel[0], sp, viewForPane(pane), 9);
        if (h) {
          session.mode = "resize";
          session.ann = sel[0];
          session.handle = h;
          session.changed = false;
          session.snapshots = [{ ann: sel[0], snap: SSA.util.clone(sel[0]), id: sel[0].id }];
          ev.preventDefault();
          return;
        }
      }

      let hit = null;
      const tol = 6 / App.state.project.view.scale;
      const anns = App.activeAnns();
      for (let i = anns.length - 1; i >= 0; i--) {
        const a = anns[i];
        if (SSA.geom.hit(a, ip, tol)) {
          hit = a;
          break;
        }
      }

      if (hit) {
        if (ev.shiftKey) {
          App.toggleSelect(hit.id);
        } else if (App.activeIds().indexOf(hit.id) < 0) {
          App.setSelection([hit.id]);
        }
        const sel2 = App.selectedAnns();
        session.mode = "move";
        session.startImg = ip;
        session.changed = false;
        session.snapshots = sel2.map(function (a) {
          return { ann: a, snap: SSA.util.clone(a), id: a.id };
        });
      } else {
        if (!ev.shiftKey) App.setSelection([]);
        App.render();
        startPan(sp);
        ev.preventDefault();
        return;
      }
      App.render();
      ev.preventDefault();
      return;
    }

    if (tool === "crop") {
      session.mode = "crop";
      session.startImg = ip;
      session.cropRect = { x: ip.x, y: ip.y, w: 0, h: 0 };
      App.state.preview = { type: "croprect", x: ip.x, y: ip.y, w: 0, h: 0 };
      App.state.previewPane = pane;
      ev.preventDefault();
      return;
    }

    if (CLICK_TOOLS[tool]) {
      session.mode = "place";
      session.startImg = ip;
      return;
    }

    if (DRAG_TOOLS[tool]) {
      session.mode = "draw";
      session.startImg = ip;
      session.current = SSA.makeAnn(tool, ip, App.state);
      App.state.preview = session.current;
      App.state.previewPane = pane;
      ev.preventDefault();
      return;
    }
  }

  function onMove(ev) {
    const App = SSA.App;
    if (!App || !App.state.project) return;
    const sp = relPt(ev);
    const world = App.screenToImage(sp.x, sp.y);

    if (session.mode === "idle") {
      const hp = paneAt(world);
      App.setPointer(sp, toLocal(world, hp));
      updateHoverCursor(sp, world);
      return;
    }

    const pane = session.pane || App.state.activePane;
    const ip = toLocal(world, pane);
    App.setPointer(sp, ip);

    if (session.mode === "pan") {
      const dx = sp.x - session.startScreen.x;
      const dy = sp.y - session.startScreen.y;
      const v = App.state.project.view;
      v.ox = session.startView.ox + dx;
      v.oy = session.startView.oy + dy;
      App.render();
      return;
    }

    if (session.mode === "moveImage") {
      const dx = world.x - session.startWorld.x;
      const dy = world.y - session.startWorld.y;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) session.changed = true;
      App.state.project.image2Pos = { x: session.startPos.x + dx, y: session.startPos.y + dy };
      App.render();
      return;
    }

    if (session.mode === "draw" && session.current) {
      const a = session.current;
      if (a.type === "freehand" || a.type === "strike") {
        a.points.push([ip.x, ip.y]);
      } else if (a.type === "arrow" || a.type === "line") {
        a.x2 = ip.x;
        a.y2 = ip.y;
      } else if (BBOX_TOOLS[a.type]) {
        const r = normalizeRect(session.startImg.x, session.startImg.y, ip.x, ip.y);
        a.x = r.x;
        a.y = r.y;
        a.w = r.w;
        a.h = r.h;
      }
      App.render();
      return;
    }

    if (session.mode === "move" && session.snapshots) {
      const dx = ip.x - session.startImg.x;
      const dy = ip.y - session.startImg.y;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) session.changed = true;
      for (let i = 0; i < session.snapshots.length; i++) {
        const item = session.snapshots[i];
        const c = SSA.util.clone(item.snap);
        SSA.geom.translate(c, dx, dy);
        Object.assign(item.ann, c);
      }
      App.render();
      return;
    }

    if (session.mode === "resize" && session.ann) {
      const item = session.snapshots[0];
      Object.assign(session.ann, SSA.util.clone(item.snap));
      SSA.geom.resize(session.ann, session.handle, ip);
      session.changed = true;
      App.render();
      return;
    }

    if (session.mode === "crop") {
      const r = normalizeRect(session.startImg.x, session.startImg.y, ip.x, ip.y);
      session.cropRect = r;
      App.state.preview = { type: "croprect", x: r.x, y: r.y, w: r.w, h: r.h };
      App.state.previewPane = pane;
      App.render();
      return;
    }
  }

  function onUp(ev) {
    const App = SSA.App;
    if (!App) return;

    if (session.mode === "pan") {
      canvas.classList.remove("cursor-pan");
      reset();
      if (App.state.tool === "pan") setCursor("cursor-pan");
      return;
    }

    if (session.mode === "moveImage") {
      canvas.classList.remove("cursor-pan");
      if (session.changed) {
        App.commitHistory();
        App.saveSoon();
      }
      reset();
      if (App.state.moveImage2) setCursor("cursor-pan");
      App.render();
      return;
    }

    if (session.mode === "draw" && session.current) {
      const a = session.current;
      let ok = true;
      if (a.type === "freehand" || a.type === "strike") {
        ok = a.points.length > 1;
      } else if (a.type === "arrow" || a.type === "line") {
        ok = Math.hypot(a.x2 - a.x1, a.y2 - a.y1) > 4;
      } else if (BBOX_TOOLS[a.type]) {
        ok = a.w > 4 && a.h > 4;
      }
      if (ok) {
        const added = App.addAnnotation(a);
        if (App.state.autoSelect && added) {
          App.setTool("select");
          App.setSelection([added.id]);
        }
      }
      reset();
      App.render();
      return;
    }

    if (session.mode === "move" || session.mode === "resize") {
      if (session.changed) {
        App.commitHistory();
        App.saveSoon();
      }
      reset();
      App.render();
      return;
    }

    if (session.mode === "crop") {
      const r = session.cropRect;
      const pane = session.pane || App.state.activePane;
      reset();
      if (r && r.w > 6 && r.h > 6) {
        App.applyCrop(r, pane);
      } else {
        App.render();
      }
      return;
    }

    if (session.mode === "place") {
      const ip = session.startImg;
      const tool = App.state.tool;
      reset();
      if (tool === "pin" || tool === "cross" || tool === "tick") {
        const added = App.addAnnotation(SSA.makeAnn(tool, ip, App.state));
        if (App.state.autoSelect && added) {
          App.setTool("select");
          App.setSelection([added.id]);
        }
      } else if (tool === "number") {
        App.addAnnotation(SSA.makeAnn("number", ip, App.state));
        App.state.project.numberSeed = (App.state.project.numberSeed || 1) + 1;
        App.renderPanel();
        App.saveSoon();
      } else if (tool === "text" || tool === "label") {
        App.promptText(tool === "text" ? "Metin gir" : "Etiket metni", {
          type: tool,
          text: "",
          fontSize: App.state.fontSize,
          bg: tool === "label" ? "color" : "none"
        }).then(function (res) {
          if (!res || !res.text) return;
          const a = SSA.makeAnn(tool, ip, App.state);
          a.text = res.text;
          a.fontSize = res.fontSize;
          a.bg = res.bg;
          const added = App.addAnnotation(a);
          if (App.state.autoSelect && added) {
            App.setTool("select");
            App.setSelection([added.id]);
          }
        });
      }
      App.render();
      return;
    }

    reset();
  }

  function onDblClick(ev) {
    const App = SSA.App;
    if (!App || !App.state.project || !App.state.project.image) return;
    const sp = relPt(ev);
    const world = App.screenToImage(sp.x, sp.y);
    const pane = paneAt(world);
    const ip = toLocal(world, pane);
    const tol = 8 / App.state.project.view.scale;
    const anns = App.paneAnns(pane);
    let hit = null;
    for (let i = anns.length - 1; i >= 0; i--) {
      const a = anns[i];
      if (a.hidden) continue;
      if (a.type !== "text" && a.type !== "label") continue;
      if (SSA.geom.hit(a, ip, tol)) {
        hit = a;
        break;
      }
    }
    if (!hit) return;
    ev.preventDefault();
    App.setActivePane(pane);
    App.setSelection([hit.id]);
    App.editTextAnn(hit);
  }

  function updateHoverCursor(sp, world) {
    const App = SSA.App;
    const tool = App.state.tool;
    if (App.state.spaceDown || tool === "pan") {
      setCursor("cursor-pan");
      return;
    }
    if (App.state.moveImage2 && App.state.project.image2) {
      const o = App.paneOrigin(2);
      const im2 = App.state.project.image2;
      const inside =
        world.x >= o.x && world.x <= o.x + im2.w && world.y >= o.y && world.y <= o.y + im2.h;
      setCursor(inside ? "cursor-pan" : "");
      return;
    }
    if (tool !== "select") {
      setCursor("");
      return;
    }
    const pane = paneAt(world);
    const ip = toLocal(world, pane);
    const view = viewForPane(pane);
    const anns = App.paneAnns(pane);
    const ids = App.paneIds(pane);
    if (ids.length === 1) {
      const a = anns.filter(function (x) {
        return x.id === ids[0];
      })[0];
      if (a) {
        const h = SSA.geom.handleAt(a, sp, view, 9);
        if (h) {
          canvas.style.cursor = SSA.geom.handleCursor(h);
          canvas.className = "";
          return;
        }
      }
    }
    const tol = 6 / view.scale;
    let hit = false;
    for (let i = anns.length - 1; i >= 0; i--) {
      if (SSA.geom.hit(anns[i], ip, tol)) {
        hit = true;
        break;
      }
    }
    setCursor(hit ? "cursor-move" : "cursor-default");
  }

  function setCursor(cls) {
    canvas.className = cls || "";
    canvas.style.cursor = "";
  }

  SSA.Tools = {
    bind: function (cv) {
      canvas = cv;
      cv.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", function () {
        reset();
        if (SSA.App) SSA.App.render();
      });
      cv.addEventListener("dblclick", onDblClick);
      cv.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });
    },
    session: session,
    setCursor: setCursor
  };
})();
