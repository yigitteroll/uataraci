<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d11" />
  <title>UAT Görsel İşaretleyici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M7 16.5 10.5 12l2.5 3 2-2.4 2 3.9" />
            <circle cx="9" cy="8" r="1.4" />
          </svg>
        </span>
        <div class="brand-text">
          <input id="projectName" class="project-name" value="Yeni Proje" spellcheck="false" aria-label="Proje adı" />
          <span class="brand-sub" id="saveStatus">Hazır</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="projectsBtn" class="btn" type="button" title="Kayıtlı projeler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Projeler</span>
        </button>
        <button id="openBtn" class="btn" type="button" title="Görsel Aç (O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
          <span>Görsel Aç</span>
        </button>
        <button id="pasteBtn" class="btn" type="button" title="Panodan Yapıştır (Ctrl+V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
          <span>Yapıştır</span>
        </button>
        <button id="captureBtn" class="btn" type="button" title="Ekran görüntüsü al">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6"/><path d="M12 17v4"/><circle cx="12" cy="10.5" r="2.6"/></svg>
          <span>Ekran Görüntüsü</span>
        </button>
        <button id="compareBtn" class="btn" type="button" title="İkinci görsel ekle / değiştir (yan yana karşılaştırma)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg>
          <span>2. Görsel</span>
        </button>

        <span class="divider"></span>

        <button id="undoBtn" class="btn icon" type="button" title="Geri Al (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button id="redoBtn" class="btn icon" type="button" title="İleri Al (Ctrl+Y)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>

        <span class="divider"></span>

        <button id="exportBtn" class="btn primary" type="button" title="PNG İndir (Ctrl+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
          <span>PNG İndir</span>
        </button>
        <button id="copyBtn" class="btn" type="button" title="Panoya Kopyala">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Kopyala</span>
        </button>

        <div class="menu-wrap">
          <button id="moreBtn" class="btn icon" type="button" title="Daha fazla">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
          <div id="moreMenu" class="menu" hidden>
            <button data-action="export-json" type="button">JSON olarak kaydet</button>
            <button data-action="import-json" type="button">JSON yükle</button>
            <button data-action="second-image" type="button">2. görseli ekle / değiştir</button>
            <button data-action="remove-image2" type="button">2. görseli kaldır</button>
            <button data-action="clear-ann" type="button">Tüm işaretlemeleri temizle</button>
            <button data-action="fit" type="button">Görsele sığdır</button>
            <button data-action="actual" type="button">%100 boyut</button>
            <button data-action="crop-reset" type="button">Tüm görseli göster</button>
          </div>
        </div>
      </div>
    </header>

    <div class="body">
      <aside class="toolbar" id="toolbar" aria-label="Araçlar"></aside>

      <main class="stage" id="stage">
        <canvas id="canvas"></canvas>

        <div class="stage-empty" id="stageEmpty">
          <div class="empty-card">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.7"/><path d="M21 15.5 16.5 11 6 21"/></svg>
            </div>
            <h2>Görsel yükle veya yapıştır</h2>
            <p>Ekran görüntüsünü buraya sürükle, <b>Görsel Aç</b> ile seç ya da <b>Ctrl+V</b> ile panodan yapıştır.</p>
            <div class="empty-actions">
              <button class="btn primary" id="emptyOpen" type="button">Görsel Aç</button>
              <button class="btn" id="emptyPaste" type="button">Panodan Yapıştır</button>
              <button class="btn" id="emptyCapture" type="button">Ekran Görüntüsü Al</button>
            </div>
          </div>
        </div>

        <div class="drop-hint" id="dropHint">Görseli buraya bırak</div>

        <div class="zoom-bar">
          <button class="zoom-btn" data-zoom="out" type="button" title="Uzaklaştır">−</button>
          <button class="zoom-btn" data-zoom="fit" id="zoomLabel" type="button" title="Sığdır">100%</button>
          <button class="zoom-btn" data-zoom="in" type="button" title="Yakınlaştır">+</button>
        </div>
      </main>

      <aside class="panel" id="panel">
        <section class="panel-block">
          <h3 class="panel-title">Özellikler</h3>

          <div class="prop-row">
            <label>Renk</label>
            <div class="color-wrap">
              <input type="color" id="colorInput" value="#ff3b30" />
              <div class="swatches" id="swatches"></div>
            </div>
          </div>

          <div class="prop-row">
            <label>Kalınlık</label>
            <div class="range-wrap">
              <input type="range" id="widthRange" min="1" max="28" step="1" value="4" />
              <span class="val" id="widthVal">4</span>
            </div>
          </div>

          <div class="prop-row">
            <label>Opaklık</label>
            <div class="range-wrap">
              <input type="range" id="opacityRange" min="0.1" max="1" step="0.05" value="1" />
              <span class="val" id="opacityVal">100%</span>
            </div>
          </div>

          <div class="prop-row" id="fontRow" hidden>
            <label>Yazı boyutu</label>
            <div class="range-wrap">
              <input type="range" id="fontRange" min="10" max="72" step="1" value="18" />
              <span class="val" id="fontVal">18</span>
            </div>
          </div>

          <div class="prop-row" id="blurRow" hidden>
            <label>Mod</label>
            <div class="seg" id="blurMode">
              <button data-mode="blur" type="button" class="is-active">Bulanık</button>
              <button data-mode="mosaic" type="button">Mozaik</button>
            </div>
          </div>

          <div class="prop-row" id="blurStrengthRow" hidden>
            <label>Şiddet</label>
            <div class="range-wrap">
              <input type="range" id="blurRange" min="2" max="40" step="1" value="12" />
              <span class="val" id="blurVal">12</span>
            </div>
          </div>

          <div class="prop-row" id="numberRow" hidden>
            <label>Sonraki no</label>
            <div class="number-wrap">
              <input type="number" id="numberSeed" min="1" step="1" value="1" />
              <button class="btn tiny" id="numberReset" type="button">Sıfırla</button>
            </div>
          </div>

          <div class="prop-row">
            <label class="check" title="Kapalıysa araç aktif kalır, arka arkaya çizim yapabilirsiniz">
              <input type="checkbox" id="autoSelect" checked />
              <span>Çizim sonrası Seç aracı</span>
            </label>
          </div>

          <div class="prop-row" id="compareRow" hidden>
            <label>2. görsel konumu</label>
            <div class="btn-row">
              <button class="btn tiny" id="img2MoveBtn" type="button" title="Taşı (M)">Taşı</button>
              <button class="btn tiny" id="img2SideBtn" type="button">Yan yana</button>
              <button class="btn tiny" id="img2OverlayBtn" type="button">Üst üste</button>
            </div>
          </div>

          <div class="prop-row" id="img2OpacityRow" hidden>
            <label>2. görsel opaklığı</label>
            <div class="range-wrap">
              <input type="range" id="img2Opacity" min="0.15" max="1" step="0.05" value="1" />
              <span class="val" id="img2OpacityVal">100%</span>
            </div>
          </div>
        </section>

        <section class="panel-block layers">
          <div class="panel-head">
            <h3 class="panel-title">Katmanlar</h3>
            <div class="pane-switch" id="paneSwitch" hidden>
              <button data-pane="1" type="button" class="is-active" title="1. görsel katmanları">1</button>
              <button data-pane="2" type="button" title="2. görsel katmanları">2</button>
            </div>
            <button class="btn tiny danger" id="deleteSelected" type="button" title="Seçilileri sil (Delete)">Sil</button>
          </div>
          <div id="layerList" class="layer-list"></div>
        </section>

        <section class="panel-block tips">
          <h3 class="panel-title">Kısayollar</h3>
          <div class="tip-grid" id="shortcutList"></div>
        </section>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="statusDims">Görsel yok</span>
      <span id="statusSel"></span>
      <span class="spacer"></span>
      <span id="statusZoom">Zoom 100%</span>
      <span id="statusPos">0, 0</span>
    </footer>
  </div>

  <div class="popover" id="projectsPop" hidden>
    <div class="popover-head">
      <strong>Kayıtlı Projeler</strong>
      <button class="icon-btn" id="projectsClose" type="button" title="Kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="popover-body" id="projectsList"></div>
    <div class="popover-foot">
      <button class="btn" id="newProjectBtn" type="button">Yeni boş proje</button>
    </div>
  </div>

  <div class="modal-overlay" id="textModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
      <div class="modal-head">
        <h2 id="textModalTitle">Metin</h2>
        <button class="icon-btn" id="textModalClose" type="button" title="Kapat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <textarea id="textModalInput" rows="3" placeholder="Metni yazın..."></textarea>
      <div class="modal-row">
        <label>Yazı boyutu</label>
        <div class="range-wrap">
          <input type="range" id="textFontRange" min="10" max="72" step="1" value="18" />
          <span class="val" id="textFontVal">18</span>
        </div>
      </div>
      <div class="modal-row">
        <label>Arka plan</label>
        <div class="seg" id="textBg">
          <button data-bg="none" type="button">Yok</button>
          <button data-bg="color" type="button">Renkli</button>
          <button data-bg="dark" type="button">Koyu</button>
          <button data-bg="light" type="button">Açık</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="textModalCancel" type="button">Vazgeç</button>
        <button class="btn primary" id="textModalOk" type="button">Ekle</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="fileInput" accept="image/*" hidden />
  <input type="file" id="fileInput2" accept="image/*" hidden />
  <input type="file" id="jsonInput" accept="application/json,.json" hidden />

  <script src="js/state.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
